name: ci
on:
  push:
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.cc }} ${{ matrix.type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          if [ "${{ matrix.cc }}" = clang ]; then export CC=clang CXX=clang++; else export CC=gcc CXX=g++; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.type }}
      - name: Build (warnings are errors)
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, ubsan, tsan]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install gcovr
      - run: cmake --preset coverage
      - run: cmake --build --preset coverage
      - run: ctest --preset coverage
      - name: Coverage summary for the book code
        run: gcovr -r . build/coverage --filter 'include/lobkit/book/' --exclude-throw-branches --print-summary

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          find include src tests -name '*.hpp' -o -name '*.cpp' | xargs clang-format --dry-run --Werror
