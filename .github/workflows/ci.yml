name: ci
# push without a branch filter runs on every branch; pull_request runs for PRs into
# any base. Both were checked against real runs (push runs 1 to 3 succeeded; the
# pull_request path has not been exercised yet because no PR exists).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.cc }} ${{ matrix.type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          if [ "${{ matrix.cc }}" = clang ]; then export CC=clang CXX=clang++; else export CC=gcc CXX=g++; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.type }}
      - name: Build (warnings are errors)
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, ubsan, tsan]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install gcovr
      - run: cmake --preset coverage
      - run: cmake --build --preset coverage
      - run: ctest --preset coverage
      - name: Coverage summary for the book code
        run: |
          gcovr -r . build/coverage --filter 'include/lobkit/book/' --filter 'src/book/' --exclude-throw-branches --merge-lines --print-summary --fail-under-line 90
          gcovr -r . build/coverage --filter 'include/lobkit/md/' --filter 'src/md/' --exclude-throw-branches --merge-lines --print-summary
          gcovr -r . build/coverage --filter 'include/lobkit/sim/' --filter 'src/sim/' --exclude-throw-branches --merge-lines --print-summary

  clang-sanitizers:
    name: clang ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan+ubsan
            flags: -fsanitize=address,undefined -fno-sanitize-recover=all
          - name: tsan
            flags: -fsanitize=thread
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libclang-rt-18-dev
      - name: Configure
        run: >
          CC=clang CXX=clang++ cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libclang-rt-18-dev
      - run: cmake --preset fuzz
      - run: cmake --build --preset fuzz
      - name: Fuzz for 60 seconds from the committed corpus
        run: |
          for t in engine lobster itch; do
            mkdir -p corpus_$t && cp fuzz/corpus/$t/* corpus_$t/
            build/fuzz/fuzz/fuzz_$t corpus_$t -max_total_time=40
          done

  bench-smoke:
    # Proves the benchmarks build and run. Shared runners are far too noisy to
    # publish numbers from, so nothing here is recorded.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset bench
      - run: cmake --build --preset bench
      - run: build/bench/bench/bench_queues --benchmark_filter='spsc_ring/payload8/64'
      - run: LOBKIT_LAT_ITEMS=2000 build/bench/bench/bench_queue_latency
      - run: LOBKIT_ROUNDS=1 build/bench/bench/bench_interleaved

  python:
    # Builds the pybind11 extension and runs pytest (through ctest, next to the C++ tests).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install numpy matplotlib pytest pybind11
      - run: cmake --preset python
      - run: cmake --build --preset python
      - run: ctest --preset python --output-on-failure
      - name: Analysis sweep, tiny grid (synthetic data)
        run: |
          PYTHONPATH=build/python/python python3 python/analysis/sweep.py --seeds 3 --messages 5000 \
            --gammas 0.05 0.5 --latencies-us 0 1000 --out sweep_ci

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          find include src tests fuzz bench tools python/src -name '*.hpp' -o -name '*.cpp' | xargs clang-format --dry-run --Werror
